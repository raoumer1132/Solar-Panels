<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL AI — Sign In to Command Center</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Linking your main stylesheet -->
    <link rel="stylesheet" href="style solai.css">
    <style>
        /* Login Page Specific Styling matching your theme */
        body.login-page-body {
            background-color: #05070c;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Background grid overlay matching your hero section */
        .grid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* Top Header */
        .login-header {
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .login-logo i {
            color: #ff6600;
        }

        .theme-toggle-btn {
            background: #111827;
            border: 1px solid #1f2937;
            color: #9ca3af;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .theme-toggle-btn:hover {
            color: #ffffff;
            border-color: #374151;
        }

        /* Main Center Card Container */
        .login-main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex: 1;
        }

        .login-card {
            background-color: #0b101d;
            border: 1px solid #1f2937;
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 25px;
            transition: color 0.2s;
        }

        .back-home-link:hover {
            color: #ffffff;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Google Button */
        .btn-google {
            width: 100%;
            background-color: #111827;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .btn-google:hover {
            background-color: #1f2937;
            border-color: #4b5563;
        }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #6b7280;
            font-size: 0.8rem;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #1f2937;
        }

        .auth-divider span {
            padding: 0 12px;
            background-color: #0b101d;
        }

        /* Form Fields */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px 15px 12px 42px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #06b6d4;
        }

        .input-field::placeholder {
            color: #4b5563;
        }

        .password-toggle-icon {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #6b7280;
        }

        .password-toggle-icon:hover {
            color: #ffffff;
        }

        /* Form Options Row */
        .form-options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            cursor: pointer;
        }

        .checkbox-container input {
            accent-color: #06b6d4;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-pass-link {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass-link:hover {
            text-decoration: underline;
        }

        /* Submit Button (Cyan Glow) */
        .btn-submit-signin {
            width: 100%;
            background: linear-gradient(135deg, #0891b2, #06b6d4);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .btn-submit-signin:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }

        /* Bottom Signup Text */
        .signup-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .signup-prompt a {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page-body">

    <!-- Background Grid Effect -->
    <div class="grid-bg-overlay"></div>

    <!-- Top Header -->
    <header class="login-header">
        <a href="sol-ai.html" class="login-logo">
            <i class="fa-solid fa-sun"></i> SOL AI
        </a>
        <button class="theme-toggle-btn" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- Center Card Section -->
    <main class="login-main-container">
        <div class="login-card">
            <a href="sol-ai.html" class="back-home-link">
                <i class="fa-solid fa-arrow-left"></i> Back to home
            </a>
            
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to your SOL AI command center</p>

            <!-- Google Sign in Button -->
            <a href="#" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.6 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
                </svg>
                Google
            </a>

            <div class="auth-divider">
                <span>or continue with email</span>
            </div>

            <!-- Login Form -->
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye password-toggle-icon" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options-row">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-pass-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit-signin">SIGN IN</button>
            </form>

            <div class="signup-prompt">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </main>

    <!-- Simple Footer Space -->
    <footer style="padding: 20px; text-align: center; color: #4b5563; font-size: 0.75rem;">
        SOL AI Command Center &bull; Secured Authentication
    </footer>

</body>
</html>
